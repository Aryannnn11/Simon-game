<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simon Game — repeat the growing color sequence and beat your high score.">
  <title>Simon Game</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <h1 id="level-title" aria-live="polite">Simon Game</h1>
    <p class="instruction" id="instruction">Watch the sequence, then repeat it in order.</p>
    <button id="start-button" type="button">Start Game</button>
    <div class="container" aria-label="Simon color buttons">
      <div class="row">
        <button id="green" class="btn green" type="button" aria-label="Green" disabled></button>
        <button id="red" class="btn red" type="button" aria-label="Red" disabled></button>
      </div>
      <div class="row">
        <button id="yellow" class="btn yellow" type="button" aria-label="Yellow" disabled></button>
        <button id="blue" class="btn blue" type="button" aria-label="Blue" disabled></button>
      </div>
    </div>
    <p class="status" id="score" aria-live="polite">Best completed level: 0</p>
  </main>
</body>
</html>
